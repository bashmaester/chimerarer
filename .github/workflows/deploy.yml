name: Deploy studio
on:
  push:
    branches: [arena/2349fcd4-chimerarer]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked -p chimera-wasm --release --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/chimera_wasm.wasm synth/src/wasm/chimera.wasm
      - name: Make engine available for preview recovery
        id: engine_blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,base64; print(json.dumps({"content":base64.b64encode(open("synth/src/wasm/chimera.wasm","rb").read()).decode(),"encoding":"base64"}))' > /tmp/engine-blob.json
          sha=$(gh api repos/${{ github.repository }}/git/blobs --method POST --input /tmp/engine-blob.json --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Engine blob ${{ steps.engine_blob.outputs.sha }}
        run: echo "Engine available"
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-wasm
          path: synth/src/wasm/chimera.wasm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
